name: 'Setup Environment'
description: 'Sets up uv python'

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: "Set up Python"
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
    - name: Install the project
      shell: bash
      run: uv sync --locked --all-extras
