name: Test and Lint

on: [pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup

      - uses: astral-sh/ruff-action@v3
      - run: ruff check --fix
      - run: ruff format

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Test with pytest
        run: |
          uv run coverage run -m pytest -v -s
      - name: Generate Coverage Report
        run: |
          uv run coverage report -m
      - name: Generate Coverage Report in XML format
        run: |
          uv run pytest --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=app tests/ | tee pytest-coverage.txt
      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: E2E Tests Placeholder
        run: echo "Placeholder for E2E tests - implementation coming soon"
