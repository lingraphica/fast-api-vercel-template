[project]
name = "fast-api-vercel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.116.1",
    "boto3>=1.39.4",
    "httpx>=0.28.1",
    "logtail>=1.0.1",
    "logtail-python>=0.3.3",
    "orjson>=3.11.1",
]

[dependency-groups]
dev = [
    "ruff>=0.12.8",
    "pre-commit>=3.5.0",
    "pytest>=8.4.1",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
    "coverage>=7.10.2",
    "pytest-env>=1.1.5",
]

[tool.coverage.run]
source = ["api"]
omit = [
    "api/utils/logger.py",
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
